<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;">
<title>DSH DLE — 启动中</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#cfd8dc;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;user-select:none;}
  .ring{width:44px;height:44px;margin:0 auto 20px;border:3px solid #2b3a42;
    border-top-color:#4aa3ff;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .t{font-size:15px;color:#8fa3ad;}
  .s{font-size:12px;color:#55656d;margin-top:10px;}
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <div class="t">正在启动 DeepSeek Harness…</div>
    <div class="s">DSH DLE</div>
  </div>
</body>
</html>
