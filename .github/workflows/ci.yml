name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm install (not ci): the local lock may lag devDependency changes;
      # install resolves and CI validates with the committed package.json.
      - run: npm install
      # Syntax check every script (node --check catches parse errors but NOT
      # undefined-variable bugs — the ESLint step below covers those).
      - run: npm test
      # Static analysis: `no-undef` catches exactly the class of bug that the
      # createWindow `win` regression was (reference to an undeclared name).
      - run: npx eslint main.js scripts/*.js

  # Build a Windows NSIS installer so every push yields a downloadable artifact
  # (previously installers were only produced manually on the dev machine).
  package-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-dle-windows
          path: release/*.exe
          if-no-files-found: error
